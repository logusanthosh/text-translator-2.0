<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Translator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🌐 Text Translator</div>
            <button id="themeBtn" type="button" aria-label="Toggle theme">🌙</button>
        </header>

        <div class="translator-card">
            <div class="language-row">
                <div>
                    <label for="fromLang">Translate From</label>
                    <select id="fromLang">
                        <option value="en">English</option>
                        <option value="ta">Tamil</option>
                        <option value="hi">Hindi</option>
                        <option value="te">Telugu</option>
                        <option value="ml">Malayalam</option>
                        <option value="kn">Kannada</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="es">Spanish</option>
                    </select>
                </div>

                <button class="swap-btn" id="swapBtn" type="button" aria-label="Swap languages">⇄</button>

                <div>
                    <label for="fontStyle">English Font Style 🎨</label>
                    <select id="fontStyle">
                        <optgroup label="🎨 Creative & Decorative">
                            <option value="artistic">Artistic</option>
                            <option value="abstract">Abstract</option>
                            <option value="decorative">Decorative</option>
                            <option value="fancy">Fancy</option>
                            <option value="creative">Creative</option>
                            <option value="artistic-brush">Artistic Brush</option>
                            <option value="paint-stroke">Paint Stroke</option>
                            <option value="ink-style">Ink Style</option>
                            <option value="marker">Marker</option>
                            <option value="chalk">Chalk</option>
                            <option value="pencil">Pencil</option>
                            <option value="crayon">Crayon</option>
                            <option value="sketch">Sketch</option>
                            <option value="watercolor">Watercolor</option>
                            <option value="graffiti">Graffiti</option>
                            <option value="spray-paint">Spray Paint</option>
                            <option value="doodle">Doodle</option>
                            <option value="comic">Comic</option>
                            <option value="cartoon">Cartoon</option>
                            <option value="sticker">Sticker</option>
                        </optgroup>
                        <optgroup label="✨ Premium & Elegant">
                            <option value="luxury">Luxury</option>
                            <option value="royal">Royal</option>
                            <option value="elegant">Elegant</option>
                            <option value="premium">Premium</option>
                            <option value="classic">Classic</option>
                            <option value="signature">Signature</option>
                            <option value="calligraphy">Calligraphy</option>
                            <option value="wedding">Wedding</option>
                            <option value="invitation">Invitation</option>
                            <option value="vintage">Vintage</option>
                            <option value="antique">Antique</option>
                            <option value="palace">Palace</option>
                            <option value="golden">Golden</option>
                            <option value="diamond">Diamond</option>
                            <option value="pearl">Pearl</option>
                            <option value="velvet">Velvet</option>
                            <option value="magazine">Magazine</option>
                            <option value="fashion">Fashion</option>
                            <option value="glamour">Glamour</option>
                            <option value="elite">Elite</option>
                        </optgroup>
                        <optgroup label="🔥 Cool & Modern">
                            <option value="modern">Modern</option>
                            <option value="minimal">Minimal</option>
                            <option value="clean">Clean</option>
                            <option value="bold">Bold</option>
                            <option value="extra-bold">Extra Bold</option>
                            <option value="thin">Thin</option>
                            <option value="ultra-thin">Ultra Thin</option>
                            <option value="rounded">Rounded</option>
                            <option value="smooth">Smooth</option>
                            <option value="geometric">Geometric</option>
                            <option value="futuristic">Futuristic</option>
                            <option value="cyber">Cyber</option>
                            <option value="digital">Digital</option>
                            <option value="tech">Tech</option>
                            <option value="matrix">Matrix</option>
                            <option value="holographic">Holographic</option>
                            <option value="sci-fi">Sci-Fi</option>
                            <option value="space">Space</option>
                            <option value="cosmic">Cosmic</option>
                            <option value="quantum">Quantum</option>
                        </optgroup>
                        <optgroup label="⚡ Effects">
                            <option value="neon">Neon</option>
                            <option value="glow">Glow</option>
                            <option value="shadow">Shadow</option>
                            <option value="long-shadow">Long Shadow</option>
                            <option value="3d">3D</option>
                            <option value="extruded-3d">Extruded 3D</option>
                            <option value="outline">Outline</option>
                            <option value="double-outline">Double Outline</option>
                            <option value="emboss">Emboss</option>
                            <option value="engraved">Engraved</option>
                            <option value="metallic">Metallic</option>
                            <option value="chrome">Chrome</option>
                            <option value="glass">Glass</option>
                            <option value="ice">Ice</option>
                            <option value="fire">Fire</option>
                            <option value="lightning">Lightning</option>
                            <option value="smoke">Smoke</option>
                            <option value="rainbow">Rainbow</option>
                            <option value="gradient">Gradient</option>
                            <option value="glitch">Glitch</option>
                        </optgroup>
                        <optgroup label="🖤 Special Styles">
                            <option value="gothic">Gothic</option>
                            <option value="dark">Dark</option>
                            <option value="horror">Horror</option>
                            <option value="mystery">Mystery</option>
                            <option value="blackletter">Blackletter</option>
                            <option value="medieval">Medieval</option>
                            <option value="ancient">Ancient</option>
                            <option value="tribal">Tribal</option>
                            <option value="tattoo">Tattoo</option>
                            <option value="rock">Rock</option>
                            <option value="metal">Metal</option>
                            <option value="punk">Punk</option>
                            <option value="street">Street</option>
                            <option value="graffiti">Graffiti</option>
                            <option value="cyberpunk">Cyberpunk</option>
                            <option value="vaporwave">Vaporwave</option>
                            <option value="retro">Retro</option>
                            <option value="synthwave">Synthwave</option>
                            <option value="arcade">Arcade</option>
                            <option value="gaming">Gaming</option>
                        </optgroup>
                        <optgroup label="💕 Cute & Social Media">
                            <option value="cute">Cute</option>
                            <option value="baby">Baby</option>
                            <option value="bubble">Bubble</option>
                            <option value="kawaii">Kawaii</option>
                            <option value="love">Love</option>
                            <option value="romantic">Romantic</option>
                            <option value="heart">Heart</option>
                            <option value="flower">Flower</option>
                            <option value="butterfly">Butterfly</option>
                            <option value="star">Star</option>
                            <option value="cloud">Cloud</option>
                            <option value="dreamy">Dreamy</option>
                            <option value="pastel">Pastel</option>
                            <option value="soft">Soft</option>
                            <option value="emoji">Emoji</option>
                            <option value="instagram">Instagram</option>
                            <option value="whatsapp">WhatsApp</option>
                            <option value="status">Status</option>
                            <option value="bio">Bio</option>
                            <option value="reels">Reels</option>
                        </optgroup>
                    </select>
                </div>

                <div>
                    <label for="toLang">Translate To</label>
                    <select id="toLang">
                        <option value="ta">Tamil</option>
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="te">Telugu</option>
                        <option value="ml">Malayalam</option>
                        <option value="kn">Kannada</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="es">Spanish</option>
                    </select>
                </div>
            </div>

            <div class="text-area-container">
                <div class="text-box">
                    <div class="box-header">
                        <span>Input Text</span>
                        <span id="charCount">0 characters</span>
                    </div>
                    <textarea id="inputText" placeholder="Type or paste your text here..."></textarea>
                    <div class="actions">
                        <button id="micBtn" type="button">🎤 Speak</button>
                        <button id="clearBtn" type="button">🗑 Clear</button>
                    </div>
                </div>

                <div class="text-box">
                    <div class="box-header">
                        <span>Translation</span>
                        <span id="status">Ready</span>
                    </div>
                    <textarea id="outputText" placeholder="Translation will appear here..." readonly></textarea>
                    <div class="actions">
                        <button id="copyBtn" type="button">📋 Copy</button>
                        <button id="speakBtn" type="button">🔊 Listen</button>
                    </div>
                </div>
            </div>

            <button class="translate-btn" id="translateBtn" type="button">Translate ✨</button>
        </div>

        <div class="history-card">
            <div class="history-header">
                <h2>Translation History</h2>
                <button id="clearHistory" type="button">Clear History</button>
            </div>
            <div id="historyList">
                <p class="empty">No translation history yet.</p>
            </div>
        </div>

        <footer>Text Translator © 2026</footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
